name: Process new issue

on:
  workflow_dispatch :
  issues:
    types: [opened]

jobs:
  wti:
    name: Run wti
    runs-on: windows-2022
    permissions:
      issues: write
    steps: 
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - uses: ./.github/actions/triage
      with: 
        issue: "${{ github.event.issue.number }}"
        token: ${{ secrets.GITHUB_TOKEN }}
name: Process new issue

on:
  workflow_dispatch :
  issues:
    types: [opened]

jobs:
  wti:
    name: Run wti
    runs-on: windows-2022
    permissions:
      issues: write
    steps: 
    - name: Checkout repo
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    
    - uses: ./.github/actions/triage
      with: 
        issue: "${{ github.event.issue.number }}"
        token: ${{ secrets.GITHUB_TOKEN }}
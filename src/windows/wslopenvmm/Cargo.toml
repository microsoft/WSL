[package]
name = "wslopenvmm"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[lib]
crate-type = ["cdylib"]

[dependencies]
hyper-util = { version = "0.1", features = ["tokio"] }
parking_lot = "0.12"
smallvec = "1"
socket2 = "0.6"
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tokio = { version = "1", features = ["net", "rt", "time", "macros", "sync"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }
windows = { version = "0.62", features = ["Win32_Foundation"] }
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_System_Diagnostics_Debug"] }

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
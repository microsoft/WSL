parameters:
  - name: pool
    type: string
    default: ''
  - name: mdeFeedServiceConnection
    type: string
    default: ''

stages:
  - stage: security_audit
    dependsOn: []
    displayName: Build and verify Linux audit payloads
    jobs:
      - ${{ each platform in split('x64,arm64', ',') }}:
        - job: audit_${{ platform }}
          timeoutInMinutes: 60
          ${{ if eq(parameters.pool, '') }}:
            pool: { type: linux }
          ${{ else }}:
            pool: { vmImage: ubuntu-24.04 }
          variables:
            ob_outputDirectory: '$(Build.SourcesDirectory)/out/audit-${{ platform }}'
            ob_artifactBaseName: drop_audit
            ob_artifactSuffix: '_${{ platform }}'
          steps:
            - bash: bash tools/securityaudit/install-build-dependencies.sh ${{ platform }}
              displayName: Install collector toolchain and target runtime
            - task: UseDotNet@2
              inputs:
                packageType: sdk
                version: 8.0.x
            - task: NuGetAuthenticate@1
              inputs:
                ${{ if ne(parameters.mdeFeedServiceConnection, '') }}:
                  nuGetServiceConnections: '${{ parameters.mdeFeedServiceConnection }}'
            - bash: |
                bash tools/securityaudit/build-collector.sh '${{ platform }}' '$(Build.BinariesDirectory)/audit-${{ platform }}'
                mkdir -p '$(ob_outputDirectory)'
                cp -r '$(Build.BinariesDirectory)/audit-${{ platform }}/payload/.' '$(ob_outputDirectory)/'
              displayName: Build and stage dynamic collector
            - ${{ if ne(parameters.pool, '') }}:
              - task: PublishPipelineArtifact@1
                inputs:
                  targetPath: '$(ob_outputDirectory)'
                  artifact: drop_audit_${{ platform }}

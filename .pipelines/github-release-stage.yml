# Creates the GitHub release as a draft with the real assets attached. create-release.py always creates a
# draft (regardless of --publish, which only gates whether it calls the GitHub API at all) — a human still
# has to review the notes and publish it by hand.

parameters:
  - name: publishPackage
    type: boolean
    default: false

  - name: packageVersion
    type: string
    default: ''

stages:
  - stage: github_release
    displayName: GitHub release
    dependsOn: [test, package]
    jobs:
      - job: github_release
        displayName: Create GitHub release
        dependsOn: [] # The stage handles this dependency

        pool:
          type: windows

        variables:
          ob_outputDirectory: '$(Build.SourcesDirectory)\out'
          ob_artifactBaseName: 'drop_wsl'
          ob_artifactSuffix: '_github_release'
          ob_sdl_checkcflags_enabled: false

        steps:
          - task: DownloadPipelineArtifact@2
            displayName: Download package artifact
            inputs:
              artifact: drop_wsl_package
              path: drop

          - task: PipAuthenticate@1
            displayName: 'Pip Authenticate'
            inputs:
              artifactFeeds: 'wsl'

          - task: AzureKeyVault@2
            displayName: Fetch GitHub release token from Key Vault
            inputs:
              azureSubscription: 'Azure-Connection'
              KeyVaultName: 'wsl-ci-key-vault'
              SecretsFilter: 'GithubReleaseToken'

          - powershell: |
              pip install --user -r tools/devops/requirements.txt
              python tools/devops/create-release.py '${{ parameters.packageVersion }}' `
                  "drop\bundle\Microsoft.WSL_${{ parameters.packageVersion }}.0_x64_ARM64.msixbundle" `
                  "drop\bundle\wsl.${{ parameters.packageVersion }}.0.arm64.msi" `
                  "drop\bundle\wsl.${{ parameters.packageVersion }}.0.x64.msi" `
                  "drop\nuget\Microsoft.WSL.Containers.${{ parameters.packageVersion }}.nupkg" `
                  --no-fetch --github-token "$env:token" ${{ iif(parameters.publishPackage, '--publish --auto-release-notes', '--use-current-ref') }}
            displayName: Create GitHub release
            env:
              token: $(GithubReleaseToken)

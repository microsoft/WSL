parameters:
  - name: rs_prerelease_only
    type: boolean
    default: false

  - name: includePackageStage
    type: boolean
    default: true

  - name: pool
    type: string
    default: ''

  - name: versions
    type: object
    default:
      - wsl1
      - wsl2
      - wslc

  - name: test_images
    type: object
    default:
      - name: rs_prerelease
        image: rs_prerelease-2026-10-05
      - name: ni_release
        image: win11-23h2-ent-2024-11-18
      - name: fe_release
        image: 2022-datacenter-g2-2024-09-10
        server: true
      - name: vb_release
        image: win10-22h2-ent-g2-2024-09-10

      # TODO: ge_release

stages:
- stage: test
  ${{ if parameters.includePackageStage }}:
    dependsOn: [build_x64, package]
  ${{ else }}:
    dependsOn: [build_x64]
  jobs:
      - ${{ each version in parameters.versions }}:
        - ${{ each image in parameters.test_images }}:
          - template: test-job.yml@self
            parameters:
              branch: "${{ image.name }}"
              version: ${{ version }}
              backend: hcs
              image: "${{ image.image }}"
              test_map_suffix: ${{ version }}
              # Skip the WSLC suite on Server images: it triggers a Hyper-V VMBus
              # PowerOff hang during VM teardown that times out the job.
              run: ${{ and(or(not(parameters.rs_prerelease_only), eq(image.name, 'rs_prerelease')), or(ne(version, 'wslc'), ne(image.server, true))) }}
              pool: "${{ parameters.pool }}"

      - template: test-job.yml@self
        parameters:
          branch: rs_prerelease
          version: wsl2
          backend: openvmm
          image: rs_prerelease-2026-10-05
          test_map_suffix: wsl2-openvmm
          run: ${{ containsValue(parameters.versions, 'wsl2') }}
          pool: "${{ parameters.pool }}"
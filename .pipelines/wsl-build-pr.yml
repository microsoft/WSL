trigger:
  branches:
    include:
    - master
    - release/*

stages:
- template: build-stage.yml@self
  parameters:
    isRelease: false
    cloudTestName: 'UnitTests::UnitTests::CachedVhdIsReattachedAfterBackingVolumeRemount'
    pool: 'wsl-build'
    vsoOrg: shine-oss
    vsoProject: wsl

- template: test-stage.yml@self
  parameters:
    includePackageStage: false
    rs_prerelease_only: true
    versions: [wsl2]
    pool: server

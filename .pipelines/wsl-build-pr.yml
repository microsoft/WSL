parameters:
  - name: mdeFeedServiceConnection
    type: string
    default: ''

trigger:
  branches:
    include:
    - master
    - release/*

stages:
- template: build-stage.yml@self
  parameters:
    isRelease: false
    pool: 'wsl-build'
    vsoOrg: shine-oss
    vsoProject: wsl
    mdeFeedServiceConnection: ${{ parameters.mdeFeedServiceConnection }}

- template: test-stage.yml@self
  parameters:
    includePackageStage: false
    rs_prerelease_only: true
    pool: server

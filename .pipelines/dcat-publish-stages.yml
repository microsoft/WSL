parameters:
  - name: platforms
    type: object
    default: [x64, arm64]

  - name: artifactPipeline
    type: string
    default: ''

  - name: initialDependsOn
    type: object
    default: []

  # OneBranch requires every release stage to declare whether it targets PPE or Production so the
  # governed template can apply the appropriate release controls.
  - name: releaseEnvironment
    type: string
    values:
      - PPE
      - Production

  - name: updateRunName
    type: boolean
    default: false

  - name: dcat
    type: object

stages:
  # Internal ring. Runs automatically.
  - stage: dcat_internal
    displayName: DCAT - internal ring
    dependsOn: ${{ parameters.initialDependsOn }}
    variables:
      ob_release_environment: ${{ parameters.releaseEnvironment }}
    jobs:
      - template: dcat-submit-job.yml
        parameters:
          name: submit_msflight
          displayName: Submit MSFlight content
          distributionIntent: MSFlight
          platforms: ${{ parameters.platforms }}
          artifactPipeline: ${{ parameters.artifactPipeline }}
          updateRunName: ${{ parameters.updateRunName }}
          dcat: ${{ parameters.dcat }}

      - template: dcat-audience-job.yml
        parameters:
          name: add_internal_audience
          displayName: Add internal audience
          audience: Internal
          dependsOn: [submit_msflight]
          platforms: ${{ parameters.platforms }}
          artifactPipeline: ${{ parameters.artifactPipeline }}
          dcat: ${{ parameters.dcat }}

  # Preview ring.
  - template: publish-gate-stage.yml
    parameters:
      name: gate_preview
      displayName: Gate - preview ring
      releaseEnvironment: ${{ parameters.releaseEnvironment }}

  - stage: dcat_preview
    displayName: DCAT - preview ring
    dependsOn: [gate_preview, dcat_internal]
    variables:
      ob_release_environment: ${{ parameters.releaseEnvironment }}
    jobs:
      - template: dcat-submit-job.yml
        parameters:
          name: submit_external
          displayName: Submit External content
          distributionIntent: External
          platforms: ${{ parameters.platforms }}
          artifactPipeline: ${{ parameters.artifactPipeline }}
          updateRunName: ${{ parameters.updateRunName }}
          dcat: ${{ parameters.dcat }}

      - template: dcat-audience-job.yml
        parameters:
          name: add_insider_audience
          displayName: Add insider audience
          audience: Insider
          dependsOn: [submit_external]
          platforms: ${{ parameters.platforms }}
          artifactPipeline: ${{ parameters.artifactPipeline }}
          dcat: ${{ parameters.dcat }}

  - template: publish-gate-stage.yml
    parameters:
      name: gate_broad
      displayName: Gate - broad ring
      releaseEnvironment: ${{ parameters.releaseEnvironment }}

  # Public release.
  - stage: dcat_broad
    displayName: DCAT - broad ring
    dependsOn: [gate_broad, dcat_preview]
    variables:
      ob_release_environment: ${{ parameters.releaseEnvironment }}
    jobs:
      - template: dcat-audience-job.yml
        parameters:
          name: add_public_audience
          displayName: Add public audience
          audience: Public
          platforms: ${{ parameters.platforms }}
          artifactPipeline: ${{ parameters.artifactPipeline }}
          dcat: ${{ parameters.dcat }}
